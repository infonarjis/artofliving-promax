    <circle cx="8" cy="18" r="1.5" fill="#d99b38"/>
    <circle cx="36" cy="18" r="1.5" fill="#d99b38"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(54, 0)">
    <!-- Vivah (Maroon) -->
    <text x="0" y="28" font-family="'Raleway', sans-serif" font-size="28" font-weight="800" fill="#681628" letter-spacing="-0.5">Vivah</text>
    <!-- Sutra (Gold) -->
    <text x="96" y="28" font-family="'Raleway', sans-serif" font-size="28" font-weight="800" fill="#ba812c" letter-spacing="-0.5">Sutra</text>
    <!-- Tagline (Tradition Meets Tomorrow) -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#5a3d31" letter-spacing="2.8">TRADITION MEETS TOMORROW</text>
  </g>
</svg>
