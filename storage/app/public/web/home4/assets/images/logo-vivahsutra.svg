    <path d="M22 36 C10 32 -1 24 2 13 C9 17 18 24 22 36 Z" fill="#681628"/>
    <path d="M22 36 C34 32 45 24 42 13 C35 17 26 24 22 36 Z" fill="#681628"/>
    
    <!-- Lower Horizontal Petals (Warm Gold) -->
    <path d="M22 36 C10 37 -1 35 1 26 C10 26 17 32 22 36 Z" fill="#c48834"/>
    <path d="M22 36 C34 37 45 35 43 26 C34 26 27 32 22 36 Z" fill="#c48834"/>
    
    <!-- Central Maroon Petal -->
    <path d="M22 6 C13 16 13 30 22 38 C31 30 31 16 22 6 Z" fill="#681628"/>
    
    <!-- Inner Golden Flame in Central Petal -->
    <path d="M22 13 C17 19 17 28 22 34 C27 28 27 19 22 13 Z" fill="#d99b38"/>
    
    <!-- Base Golden Diamond / Drop -->
    <path d="M22 39 L24 43 L22 47 L20 43 Z" fill="#c48834"/>
    
