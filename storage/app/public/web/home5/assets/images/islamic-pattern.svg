<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <!-- Central 8-pointed star (Rub el Hizb) -->
    <g id="star8">
      <rect x="-14" y="-14" width="28" height="28" fill="none" stroke="#D4AF37" stroke-width="1" />
      <rect x="-14" y="-14" width="28" height="28" transform="rotate(45)" fill="none" stroke="#D4AF37" stroke-width="1" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#0D6E58" stroke-width="0.8" />
    </g>
    <!-- Girih interlocking lines -->
    <g id="girih-tile">
      <!-- Center star -->
      <use href="#star8" x="40" y="40" />
      
      <!-- Corner stars -->
      <use href="#star8" x="0" y="0" />
      <use href="#star8" x="80" y="0" />
      <use href="#star8" x="0" y="80" />
      <use href="#star8" x="80" y="80" />

      <!-- Interconnecting geometric diagonal lattice -->
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>
      <path d="M0 0 L80 80 M80 0 L0 80" fill="none" stroke="#0D6E58" stroke-width="0.6" opacity="0.4"/>
      <path d="M40 0 L40 80 M0 40 L80 40" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.4"/>

      <polygon points="40,26 44,30 40,34 36,30" fill="none" stroke="#D4AF37" stroke-width="0.75" />
      <polygon points="40,46 44,50 40,54 36,50" fill="none" stroke="#D4AF37" stroke-width="0.75" />
      <polygon points="26,40 30,44 34,40 30,36" fill="none" stroke="#D4AF37" stroke-width="0.75" />
      <polygon points="46,40 50,44 54,40 50,36" fill="none" stroke="#D4AF37" stroke-width="0.75" />
    </g>
  </defs>

  <rect width="80" height="80" fill="none" />
  <use href="#girih-tile" />
</svg>
